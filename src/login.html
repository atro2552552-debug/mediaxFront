<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#3b987e" />
    <title>Sign In | Media X</title>
    <link rel="stylesheet" href="./assets/fontawesome/css/all.min.css" />
    <link rel="stylesheet" href="./css/fonts.css" />
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <main class="mobile form-page">
      <header class="form-header">
        <a class="back" href="./signup.html"><i class="fa-solid fa-chevron-left" aria-hidden="true"></i> Back</a>
        <h1>Sign In</h1>
        <span class="header-space" aria-hidden="true"></span>
      </header>
      <section class="form-card">
        <h2>Welcome Back</h2>
        <p class="form-intro">Sign in to keep exploring amazing destinations around the world!</p>
        <form class="fields">
          <label class="field"><i class="fa-regular fa-envelope field-icon" aria-hidden="true"></i><input type="email" class="email" placeholder="Enter your email address" aria-label="Email address" /></label>
          <label class="field"><i class="fa-solid fa-lock field-icon" aria-hidden="true"></i><input type="password" class="password" placeholder="Enter password" aria-label="Password" /><i class="fa-solid fa-eye-slash eye" aria-hidden="true"></i></label>
        </form>
        <a class="forgot-link" href="./forgot.html">Forgot Password?</a>
        <button class="button form-button" type="button"><span>Sign In</span><i class="fa-solid fa-arrow-right arrow" aria-hidden="true"></i></button>
        <p class="login-footer">Don’t have an account? <a href="./signup.html">Create Account</a></p>
      </section>
    </main>

    <script type="module" src="./js/additions.js"></script>
     <script src="./js/login.js" type="module"></script>
  </body>
</html>
