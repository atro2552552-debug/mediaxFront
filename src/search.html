<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#3b987e" />
    <title>Search | Media X</title>
    <link rel="stylesheet" href="./assets/fontawesome/css/all.min.css" />
    <link rel="stylesheet" href="./css/fonts.css" />
    <link rel="stylesheet" href="./css/home.css" />
    <link rel="stylesheet" href="./css/search.css" />
  </head>
  <body>
    <main class="search-page">
      <header class="search-header">
        <a class="search-back" href="./home.html" aria-label="Back to home">
          <i class="fa-solid fa-chevron-left" aria-hidden="true"></i>
        </a>
        <div>
          <h1>Search</h1>
          <p>Find people on Media X</p>
        </div>
      </header>

      <section class="search-scroll">
        <div class="search-field">
          <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
          <input id="user-search" type="search" placeholder="Search by name or username" autocomplete="off" aria-label="Search users" />
          <button class="search-clear" id="search-clear" type="button" aria-label="Clear search" hidden>
            <i class="fa-solid fa-xmark" aria-hidden="true"></i>
          </button>
        </div>

        <div class="search-results-heading">
          <h2>People</h2>
          <span id="search-count" aria-live="polite"></span>
        </div>

        <section class="user-results" id="user-results" aria-label="Search results" aria-live="polite">
          <div class="search-state">
            <i class="fa-solid fa-spinner" aria-hidden="true"></i>
            <span>Loading people...</span>
          </div>
        </section>
      </section>

      <nav class="bottom-nav" aria-label="Main navigation">
        <a class="nav-item" href="./home.html" aria-label="Home">
          <i class="fa-solid fa-house" aria-hidden="true"></i>
        </a>
        <a class="nav-item" href="./conversations.html" aria-label="Messages">
          <i class="fa-regular fa-message" aria-hidden="true"></i>
        </a>
        <a class="nav-item search-nav-active" href="./search.html" aria-label="Search">
          <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
          <span>Search</span>
        </a>
        <a class="nav-item" href="./user.html" aria-label="Profile">
          <i class="fa-regular fa-user" aria-hidden="true"></i>
        </a>
      </nav>
    </main>
    <script src="./js/search.js" type="module"></script>
  </body>
</html>
