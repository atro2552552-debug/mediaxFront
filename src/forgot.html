<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#3b987e" />
    <title>Forgot Password | Media X</title>
    <link rel="stylesheet" href="./assets/fontawesome/css/all.min.css" />
    <link rel="stylesheet" href="./css/fonts.css" />
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <main class="mobile form-page">
      <header class="form-header">
        <a class="back" href="./signup.html"><i class="fa-solid fa-chevron-left" aria-hidden="true"></i> Back</a>
        <h1>Forgot Password</h1>
        <span class="header-space" aria-hidden="true"></span>
      </header>
      <section class="form-card">
        <h2>Don’t Worry I’ll Help You</h2>
        <p class="form-intro">Please enter your email address to reset your password</p>
        <form class="fields">
          <label class="field"><i class="fa-regular fa-envelope field-icon" aria-hidden="true"></i><input type="email" placeholder="Enter you email address" aria-label="Email address" /></label>
        </form>
        <a class="button form-button"><span>Send Instructions</span><i class="fa-solid fa-arrow-right arrow" aria-hidden="true"></i></a>
      </section>
    </main>
  </body>
</html>
