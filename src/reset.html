<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#3b987e" />
    <title>New Password | Media X</title>
    <link rel="stylesheet" href="./assets/fontawesome/css/all.min.css" />
    <link rel="stylesheet" href="./css/fonts.css" />
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <main class="mobile form-page">
      <header class="form-header">
        <a class="back" href="./forgot.html"><i class="fa-solid fa-chevron-left" aria-hidden="true"></i> Back</a>
        <h1>Forgot Password</h1>
        <span class="header-space" aria-hidden="true"></span>
      </header>
      <section class="form-card">
        <h2>Create New Password</h2>
        <p class="form-intro">Your new password must be different from previous used passwords.</p>
        <form class="fields">
          <label class="field"><i class="fa-solid fa-lock field-icon" aria-hidden="true"></i><input type="password" placeholder="Enter password" aria-label="New password" /><i class="fa-solid fa-eye-slash eye" aria-hidden="true"></i></label>
          <label class="field"><i class="fa-solid fa-lock field-icon" aria-hidden="true"></i><input type="password" placeholder="Re-enter password" aria-label="Confirm new password" /><i class="fa-solid fa-eye-slash eye" aria-hidden="true"></i></label>
        </form>
        <a class="button form-button" href="./signup.html"><span>Send Instructions</span><i class="fa-solid fa-arrow-right arrow" aria-hidden="true"></i></a>
      </section>
    </main>
  </body>
</html>
