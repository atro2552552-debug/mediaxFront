<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#3b987e" />
    <title>Create Account | Media X</title>
    <link rel="stylesheet" href="./assets/fontawesome/css/all.min.css" />
    <link rel="stylesheet" href="./css/fonts.css" />
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <main class="mobile form-page">
      <header class="form-header">
        <a class="back" href="./life.html"><i class="fa-solid fa-chevron-left" aria-hidden="true"></i> Back</a>
        <h1>Create Account</h1>
        <span class="header-space" aria-hidden="true"></span>
      </header>
      <section class="form-card">
        <h2>Welcome</h2>
        <p class="form-intro">Create Account to keep exploring amazing destinations around the world!</p>
        <form class="fields">
          <label class="field"><i class="fa-regular fa-user field-icon"></i><input type="text" class="fullname" placeholder="Enter your full name" aria-label="Full name" /></label>
          <label class="field"><i class="fa-regular fa-envelope field-icon"></i><input type="email" class="email" placeholder="Enter you email address" aria-label="Email address" /></label>
          <label class="field"><i class="fa-solid fa-lock field-icon" aria-hidden="true"></i><input type="password" class="password" placeholder="Enter password" aria-label="Password" /><i class="fa-solid fa-eye-slash eye" aria-hidden="true"></i></label>
          <label class="field"><i class="fa-solid fa-lock field-icon" aria-hidden="true"></i><input type="password" class="confirmPassword" placeholder="Enter confirm password" aria-label="Confirm password" /><i class="fa-solid fa-eye-slash eye" aria-hidden="true"></i></label>
        </form>
        <button class="button form-button" type="button"><span>Create Account</span><i class="fa-solid fa-arrow-right arrow" aria-hidden="true"></i></button>
        <p class="sign-in">Already have an account? <a href="./login.html">Sign in</a></p>
        <p class="terms">By creating an account, you agree to our<br /><a href="#terms">Terms &amp; Conditions</a> and agree to <a href="#privacy">Privacy Policy</a></p>
      </section>
    </main>
    <script type="module" src="./js/additions.js"></script>
    <script type="module" src="./js/signup.js"></script>
  </body>
</html>
